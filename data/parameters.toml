# Every scalar the model uses, with its source. Money in GBP. Prices read on 2 Nov 2026 unless dated.
# USD prices are converted at the ECB reference rates of 30 Oct 2026 (see [constants].usd_gbp).

[inflation]
base_2024 = ["2024"]
base_2002 = ["2002", "2003"]   # the 2002 rebrand was "spread over two years"
today = "2026 SEP"
today_label = "September 2026"

# ---------------------------------------------------------------------------
# Estimated split of the official £434,801.47 (Imperial refused a breakdown, FOI s.43).
# The agencies' slice is the remainder.
[split.agencies]
label = "Brand agencies"
receipt = "Strategy, identity, templates"
color = "s1"
residual = true
basis = "Remainder of the official total: brand strategy (Simple Revolution), visual and verbal identity (Pentagram), launch assets, templating, training, accessibility and inclusivity research (Open Inclusion)."

[split.font]
label = "Bespoke typeface"
receipt = "Typeface (3 families)"
color = "s2"
central = 50000
low = 30000
high = 90000
max = 150000
basis = "Assumption. A custom family in three styles (Imperial Sans, Sans Display, Slab), drawn by NaN for Pentagram. Commissioned corporate typefaces typically cost tens of thousands of pounds."

[split.signage]
label = "New signage, all campuses"
receipt = "Signs across campuses"
color = "s3"
central = 100000
low = 50000
high = 170000
max = 250000
basis = "Assumption, bottom-up. Main identification signs and building lettering at Imperial's eight or nine campuses at roughly £5k–£15k each, plus banners and smaller signs. Felix reported new signs around campus in launch week and banners on Dalby Court."

[split.promo]
label = "Video, lanyards and promo"
receipt = "Animation video, lanyards"
color = "s4"
central = 35000
low = 15000
high = 60000
max = 100000
basis = "Assumption. A short brand animation (about £10k–£30k) plus branded lanyards for staff and students (about £1–£2 each)."

# ---------------------------------------------------------------------------
[constants]
usd_gbp = 0.74633
burger_kg = 0.1134
working_days = 252
bottle_height_m = 0.2
thesis_words = 80000
tokens_per_word = 1.33
chatgpt_plus_month_gbp = 19.99
lab_cost_per_m2 = 4500
lab_m2_per_workplace = 7.5
pi_startup_gbp = 40000

[constant_sources]
usd_gbp = "ECB euro reference rates, 30 Oct 2026: €1 = $1.1172 = £0.83380, so $1 = £0.74633 (https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml)"
burger_kg = "A quarter-pound patty, 113.4 g"
working_days = "Approximate UK working days in a year"
bottle_height_m = "Assumption: a 500 mL medium bottle stands about 20 cm tall with its cap"
thesis_words = "Assumption: a typical PhD thesis (Imperial's limit is 100,000 words)"
tokens_per_word = "OpenAI rule of thumb: one token is about 0.75 English words"
chatgpt_plus_month_gbp = "ChatGPT Plus, UK App Store in-app price, read 2 Nov 2026 (https://apps.apple.com/gb/app/chatgpt/id6448311069)"
lab_cost_per_m2 = "Savills (18 May 2026): wet-lab shell and core ≈ £420/sq ft ≈ £4,521/m², fit-out extra (https://www.savills.co.uk/research_articles/229130/390425-0); AECOM cost model for a mostly CL2 university lab, £4,442/m² at Q4 2015 prices, excl. equipment, fees and VAT (https://www.building.co.uk/cost-model-laboratories/5078736.article). A lower bound for a working lab."
lab_m2_per_workplace = "Imperial space norms: 7.5 m² per laboratory workplace (https://www.imperial.ac.uk/media/imperial-college/administration-and-support-services/estates-projects/public/space/sm02spacenorms.pdf)"
pi_startup_gbp = "Acton et al. 2019, 'A survey of new PIs in the UK', eLife 8:e46827: average start-up funds £45.6k (men), £31k (women), 2012–18 appointments (https://elifesciences.org/articles/46827)"

